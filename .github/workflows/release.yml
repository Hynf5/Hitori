name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Pilih tipe release'
        required: true
        default: 'release'
        type: choice
        options:
          - pre-release
          - release
      tag:
        description: 'Tag versi Stable (misal v9.2/9.2)'
        required: false
      release_title:
        description: 'Judul tambahan Stable (Hotfix)'
        required: false
      nightly_parsers_commit:
        description: 'Commit hash parsers (Nightly only)'
        required: false
      nightly_changelog:
        description: 'Changelog for Nightly, gunakan ";" untuk pisah baris'
        required: false
      nightly_upload_type:
        description: 'Nightly upload type'
        required: false
        default: 'both'
        type: choice
        options:
          - artifacts-only
          - both

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 🛠️
        uses: android-actions/setup-android@v3

      - name: Decode keystore 🔑
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Set NIGHTLY_COMMIT env 🌙
        if: ${{ github.event.inputs.release_type == 'pre-release' }}
        run: |
            echo "NIGHTLY_COMMIT=${{ github.event.inputs.nightly_parsers_commit }}" >> $GITHUB_ENV

      - name: Get release names 🏷️
        id: names
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "pre-release" ]; then
            DATE=$(TZ=Asia/Jakarta date +'%d/%m/%Y')
          if [ -n "$NIGHTLY_COMMIT" ]; then
            SHORT_SHA=${NIGHTLY_COMMIT:0:10}  # ambil 10 karakter pertama dari commit input
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
          fi

            DISPLAY_NAME="Nightly ${DATE}"
            TAG_NAME="Nightly-$(TZ=Asia/Jakarta date +'%d%m%Y')"
          else
            if [ -z "${{ github.event.inputs.tag }}" ]; then
              echo "ERROR: Tag wajib diisi untuk Stable release"
              exit 1
            fi

            RAW_TAG="${{ github.event.inputs.tag }}"
            TAG="${RAW_TAG#v}"

            TITLE="${{ github.event.inputs.release_title }}"

            # <<< BARU: Set display name sesuai title opsional
            if [ -z "$TITLE" ]; then
                DISPLAY_NAME="Hitori v${TAG}"
            else
                DISPLAY_NAME="Hitori v${TAG} - ${TITLE}"
            fi

            TAG_NAME="v${TAG}"
          fi

          echo "display_name=${DISPLAY_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set artifact name 📦
        id: artifact
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "pre-release" ]; then
            DATE=$(TZ=Asia/Jakarta date +'%d%m%Y')
            ARTIFACT_NAME="hitori-nightly-${DATE}"
          else
            RAW_TAG="${{ github.event.inputs.tag }}"
            TAG="${RAW_TAG#v}"
            ARTIFACT_NAME="hitori-stable-v${TAG}"
          fi

          echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog 📝
        id: prepare
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "pre-release" ]; then
            INPUT="${{ github.event.inputs.nightly_changelog }}"
            FORMATTED_LOG=$(echo "$INPUT" | sed 's/;/\n/g')

            if [ -f NIGHTLY_CHANGELOG.md ]; then
              OLD_LOG=$(cat NIGHTLY_CHANGELOG.md)
              echo -e "${FORMATTED_LOG}\n\n${OLD_LOG}" > NIGHTLY_CHANGELOG.md
            else
              echo -e "${FORMATTED_LOG}" > NIGHTLY_CHANGELOG.md
            fi

            CHANGELOG_FILE="NIGHTLY_CHANGELOG.md"
          else
            RAW_TAG="${{ github.event.inputs.tag }}"
            TAG="${RAW_TAG#v}"
            
            awk -v tag="$TAG" '
              $0 ~ ("^## v" tag) {flag=1; next}
              /^## / && $0 !~ ("^## v" tag) {flag=0}
              flag {print}
            ' CHANGELOG.md > RELEASE_CHANGELOG.md

            if [ ! -s RELEASE_CHANGELOG.md ]; then
              echo "No changelog found for v${TAG}" > RELEASE_CHANGELOG.md
            fi

            CHANGELOG_FILE="RELEASE_CHANGELOG.md"
          fi

          echo "changelog_file=${CHANGELOG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle 🗂️
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Override parsers version (Nightly only) 🔧
        if: ${{ github.event.inputs.release_type == 'pre-release' && github.event.inputs.nightly_parsers_commit != '' }}
        run: |
          sed -i 's/^parsers = "[^"]*"/parsers = "${{ github.event.inputs.nightly_parsers_commit }}"/' gradle/libs.versions.toml

      - name: Build APK 🏗️
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
             ./gradlew assembleRelease --no-daemon --stacktrace || \
             ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK (Nightly only) 📦
        if: ${{ github.event.inputs.release_type == 'pre-release' }}
        run: |
          cd app/build/outputs/apk/release
          for file in *.apk; do
            mv "$file" "hitori-nightly.apk"
          done

      - name: Archive APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release APK 🚀
        if: ${{ github.event.inputs.release_type != 'pre-release' || github.event.inputs.nightly_upload_type == 'both' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.names.outputs.tag_name }}
          name: ${{ steps.names.outputs.display_name }}
          body_path: ${{ steps.prepare.outputs.changelog_file }}
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      # 🔥 KIRIM PAYLOAD ACTOR KE DISCORD WORKFLOW
      - name: Trigger Discord notification 🔥
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          event-type: new-release
          client-payload: |
            {
              "tag": "${{ steps.names.outputs.tag_name }}",
              "prerelease": "${{ github.event.inputs.release_type == 'pre-release' }}",
              "actor": "${{ github.actor }}"
            }

      - name: Clean up keystore 🧹
        if: always()
        run: rm -f keystore.jks

        
