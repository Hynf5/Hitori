name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Pilih tipe release'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - pre-release
          - release
      tag:
        description: 'Tag untuk release (misal v9.2)'
        required: false
      nightly_changelog:
        description: 'Isi changelog Nightly (gunakan ";" untuk pisah baris, hanya untuk Pre-release)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Get release names
        id: names
        run: |
          if [ "${{ github.event.inputs.release_type }}" == "pre-release" ]; then
            DISPLAY_NAME="Nightly $(date -u +'%d/%m/%Y')"
            TAG_NAME="nightly-$(date -u +'%Y%m%d')"
          else
            DISPLAY_NAME="Hitori ${{ github.event.inputs.tag }}"
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          echo "display_name=$DISPLAY_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare changelog
        run: |
          if [ "${{ github.event.inputs.release_type }}" == "pre-release" ]; then
            # Ambil input dari UI untuk Nightly changelog
            INPUT="${{ github.event.inputs.nightly_changelog }}"
            FORMATTED_LOG=$(echo "$INPUT" | sed 's/;/\n/g')
            NEW_LOG="## Changelog Nightly $(date -u +'%d/%m/%Y')\n$FORMATTED_LOG"

            if [ -f NIGHTLY_CHANGELOG.md ]; then
              OLD_LOG=$(cat NIGHTLY_CHANGELOG.md)
              echo -e "$NEW_LOG\n\n$OLD_LOG" > NIGHTLY_CHANGELOG.md
            else
              echo -e "$NEW_LOG" > NIGHTLY_CHANGELOG.md
            fi

            CHANGELOG_FILE="NIGHTLY_CHANGELOG.md"
          else
            CHANGELOG_FILE="RELEASE_CHANGELOG.md"
          fi
          echo "Using changelog file: $CHANGELOG_FILE"
          echo "changelog_file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.names.outputs.tag_name }}
          name: ${{ steps.names.outputs.display_name }}
          body_path: ${{ steps.prepare.outputs.changelog_file }}
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
