name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v9.0)'
        required: true
        default: 'v9.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pastikan ambil semua commit terbaru

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      # ====== AMBIL CHANGELOG SESUAI TAG ======
      - name: Extract changelog for tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "Extracting changelog for $TAG"

          # Pakai awk untuk ambil semua line di bawah header tag sampai header berikutnya
          awk -v tag="## $TAG" '
            $0 ~ tag {flag=1; next}      # mulai ambil setelah header tag
            /^## v/ {flag=0}             # berhenti jika ketemu header versi lain
            flag {print}                 # print baris yang sesuai
          ' CHANGELOG.md > RELEASE_CHANGELOG.md

          # Jika kosong, tulis pesan default
          if [ ! -s RELEASE_CHANGELOG.md ]; then
            echo "No changelog found for $TAG" > RELEASE_CHANGELOG.md
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Hitori ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_CHANGELOG.md
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
