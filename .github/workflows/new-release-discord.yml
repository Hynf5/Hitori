name: Discord Release Webhook

on:
  workflow_run:
    workflows: ["Release Build"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # 1️⃣ GET LATEST RELEASE
      # ===============================
      - name: Get latest release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo });
            const r = releases.data[0];

            if (!r) throw new Error("No release found");

            const apk = r.assets.find(a => a.name.endsWith(".apk"));

            core.setOutput("tag", r.tag_name);
            core.setOutput("url", r.html_url);
            core.setOutput("body", r.body || "No changelog");
            core.setOutput("prerelease", String(r.prerelease));
            core.setOutput("published", r.published_at);
            core.setOutput("apk", apk ? apk.browser_download_url : r.html_url);

      # ===============================
      # 2️⃣ STABLE RELEASE EMBED
      # ===============================
      - name: Send RELEASE embed to Discord
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          content: "<@&1450527196593651792>"

          embed-title: "🚀 New Release: ${{ github.event.repository.name }} ${{ steps.release.outputs.tag }}"
          embed-url: "${{ steps.release.outputs.url }}"
          embed-description: "${{ steps.release.outputs.body }}"
          embed-color: 12058646
          embed-thumbnail-url: "${{ secrets.THUMBNAIL_URL }}"
          embed-author-name: "${{ github.actor }}"
          embed-author-icon-url: "https://github.com/${{ github.actor }}.png"
          embed-footer-text: "Hitori ${{ steps.release.outputs.tag }}"
          embed-timestamp: "${{ steps.release.outputs.published }}"

      # ===============================
      # 3️⃣ DELAY
      # ===============================
      - name: Wait 1 second
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        run: sleep 1

      # ===============================
      # 4️⃣ DOWNLOAD EMBED
      # ===============================
      - name: Send Download Hitori (Embed)
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          
          embed-description: |
            **📥 [Download Hitori APK](${{ steps.release.outputs.url }})**
          embed-color: 12058646

      # ===============================
      # 5️⃣ PRE-RELEASE EMBED
      # ===============================
      - name: Send prerelease embed to Discord
        if: ${{ steps.release.outputs.prerelease == 'true' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

          embed-title: "🧪 Pre-Release: ${{ github.event.repository.name }} ${{ steps.release.outputs.tag }}"
          embed-url: "${{ steps.release.outputs.url }}"
          embed-description: "${{ steps.release.outputs.body }}"
          embed-color: 15105570
          embed-author-name: "${{ github.actor }}"
          embed-author-icon-url: "https://github.com/${{ github.actor }}.png"
          embed-footer-text: "Pre-release build"
          embed-timestamp: "${{ steps.release.outputs.published }}"

