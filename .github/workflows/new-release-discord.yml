name: Discord Release Webhook

on:
  repository_dispatch:
    types: [new-release]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Get release by tag
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const payload = context.payload.client_payload;
            const tag = payload.tag;
            const isPrerelease = payload.prerelease === 'true' || payload.prerelease === true;
            const actor = payload.actor || "Automation";
            const avatar = `https://github.com/${actor}.png`;

            if (!tag) throw new Error("Missing tag in payload");

            const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const r = res.data;
            const tagRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${r.tag_name}` });
            const shortSha = tagRef.data.object.sha.substring(0, 7);
            const apk = r.assets.find(a => a.name.endsWith(".apk"));

            core.setOutput("tag", r.tag_name);
            core.setOutput("url", r.html_url);
            core.setOutput("body", r.body || "No changelog provided.");
            core.setOutput("commit", shortSha);
            core.setOutput("prerelease", String(r.prerelease));
            core.setOutput("published", r.published_at);
            core.setOutput("apk", apk ? apk.browser_download_url : r.html_url);
            core.setOutput("author", actor);
            core.setOutput("author_avatar", avatar);

      # STABLE EMBED
      - name: Send RELEASE embed to Discord
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          content: "<@&1450527196593651792>"
          embed-title: "🚀 New Release: ${{ github.event.repository.name }} ${{ steps.release.outputs.tag }}"
          embed-url: "${{ steps.release.outputs.url }}"
          embed-description: "${{ steps.release.outputs.body }}"
          embed-color: 12058646
          embed-thumbnail-url: "${{ secrets.THUMBNAIL_URL }}"
          embed-footer-icon-url: "${{ steps.release.outputs.author_avatar }}"
          embed-footer-text: "${{ steps.release.outputs.author }} 🍃 | +${{ steps.release.outputs.commit }}"
          embed-timestamp: "${{ steps.release.outputs.published }}"

      # STABLE DOWNLOAD
      - name: Send STABLE download embed
        if: ${{ steps.release.outputs.prerelease == 'false' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          embed-description: |
            ### **📥 [Download Hitori Build](${{ steps.release.outputs.url }})**
          embed-color: 12058646

      # NIGHTLY / PRE-RELEASE EMBED
      - name: Send PRE-RELEASE embed
        if: ${{ steps.release.outputs.prerelease == 'true' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          embed-title: "🧪 Pre-release: ${{ github.event.repository.name }} ${{ steps.release.outputs.tag }}"
          embed-url: "${{ steps.release.outputs.url }}"
          embed-description: "${{ steps.release.outputs.body }}"
          embed-color: 15105570
          embed-footer-icon-url: "${{ steps.release.outputs.author_avatar }}"
          embed-footer-text: "${{ steps.release.outputs.author }} 🍃 | +${{ steps.release.outputs.commit }}"
          embed-timestamp: "${{ steps.release.outputs.published }}"
      # PRE-RELEASE → CHANNEL 2
      - name: Send PRE-RELEASE embed (Channel B)
        if: ${{ steps.release.outputs.prerelease == 'true' }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_NIGHTLY_RELEASE }}
          embed-title: "🧪 Pre-release: ${{ github.event.repository.name }} ${{ steps.release.outputs.tag }}"
          embed-url: "${{ steps.release.outputs.url }}"
          embed-description: "${{ steps.release.outputs.body }}"
          embed-color: 15105570
          embed-footer-icon-url: "${{ steps.release.outputs.author_avatar }}"
          embed-footer-text: "${{ steps.release.outputs.author }} 🍃 | +${{ steps.release.outputs.commit }}"
          embed-timestamp: "${{ steps.release.outputs.published }}"
