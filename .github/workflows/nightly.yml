name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_NIGHTLY=$(gh release list --limit 100 | grep -i nightly | head -1)

          if [ -z "$LAST_NIGHTLY" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(echo "$LAST_NIGHTLY" | awk '{print $1}')
          COMMIT_COUNT=$(git rev-list "$LAST_TAG"..HEAD --count || echo "0")

          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build Nightly APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleNightly

      - name: Generate version
        id: version
        run: |
          DATE=$(date -u +"%Y%m%d")
          SHA=$(git rev-parse --short=7 HEAD)
          echo "tag=nightly-$DATE-$SHA" >> $GITHUB_OUTPUT
          echo "name=Nightly $DATE ($SHA)" >> $GITHUB_OUTPUT

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hitori ${{ steps.version.outputs.name }}
          prerelease: true
          files: app/build/outputs/apk/nightly/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
